[project]
name = "datasheet-assistant"
version = "0.1.0"
description = "Answers questions about Bosch Sensortec datasheets, showing only answers whose quotes and numbers are verified against the page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.6.0",
    "fastapi==0.162.2",
    "pypdfium2==5.15.1",
    "uvicorn==0.54.0",
]

[project.scripts]
datasheet-assistant = "datasheet_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "vulture==2.16",
]
docs = [
    "matplotlib==3.11.2",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare assert, and test tables use literal values.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# pypdfium2 ships no type information; its calls are confined to ingest.py.
module = ["pypdfium2"]
ignore_missing_imports = true
